# Déploiement sur un serveur (VPS) avec un nom de domaine :
#   1. Faites pointer le domaine (ex. facturation.iam.bf) vers l'adresse IP du serveur.
#   2. Copiez deploy/.env.example en deploy/.env et remplissez-le.
#   3. docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Caddy obtient et renouvelle automatiquement le certificat HTTPS.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Plusieurs clients : davantage de connexions (4 au plus par client actif)
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-128MB}"]
    environment:
      POSTGRES_DB: iam_invoicer
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam_invoicer"]
      interval: 10s
      retries: 5

  app:
    # Image construite par GitHub (téléchargée) ; « docker compose build » la reconstruit localement.
    image: ${IAM_IMAGE:-ghcr.io/tenak27/iam-invoicer:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://iam:${DB_PASSWORD}@db:5432/iam_invoicer
      DOWNLOADS_DIR: /telechargements
      # Hébergement de plusieurs clients (une base PostgreSQL chacun, adresses /t/<client>) :
      # renseignez ADMIN_TOKEN dans deploy/.env (openssl rand -hex 32). Vide : un seul client.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      # Déposez ici les installateurs (.exe, .dmg, .apk) proposés sur le site
      - ./telechargements:/telechargements:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
