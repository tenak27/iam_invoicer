<style>
/* Layout: une scène 16:9 centrée, contrôles en dessous. Identité IAM, look clair unique. */
:root{
  --bg:#EDEFF6; --stage:#FFFFFF; --ink:#141420; --muted:#555A70;
  --blue:#3C54A5; --blue-2:#8694CA; --line:#D5D9E8;
  --f-brand:'Open Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  color-scheme: light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-brand);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}
.frame{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(40,56,110,.35)}
#stage{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls .sep{flex:1 1 20px}
button{font:600 13px/1 var(--f-brand);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:var(--stage);border:1px solid var(--line);border-radius:999px;padding:12px 16px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--blue-2)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
button.main{background:var(--blue);color:#fff;border-color:var(--blue)}
#stage .fb{transform-box:fill-box;transform-origin:center}
#stage .fr{transform-box:fill-box;transform-origin:100% 50%}
#logo{transform-box:view-box;transform-origin:0 0}
/* Intégré au site (marques.html?embed) : sans titre ni fond, scène seule et contrôles centrés */
.embed,.embed body{padding:0;background:#fff}
.embed header{display:none}
.embed .wrap{gap:14px;max-width:none}
.embed .frame{border:0;border-radius:22px;box-shadow:none}
.embed .controls{justify-content:center}
.embed .controls .sep{display:none}
.embed button{padding:9px 13px;min-height:38px;font-size:12px}
@media (max-width:640px){.embed #chips{display:none!important}}
</style>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var brands = [
    {k:'tech', n:'TECHNOLOGY', label:'Technology'},
    {k:'inv',  n:'INVOICER',   label:'Invoicer'},
    {k:'mail', n:'MAILS',      label:'Mails'},
    {k:'chan', n:'CHANTIER',   label:'Chantier'},
    {k:'btp',  n:'BTP',        label:'BTP'},
    {k:'ecom', n:'E-COMMERCE', label:'e-Commerce'},
    {k:'edu',  n:'ÉDUCATION',  label:'Éducation'}
  ];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){ return document.getElementById(id); };
  var logo=$('logo'), exB=$('exBack'), exF=$('exFront'), dot=$('dot'), am=$('am'),
      cardB=$('cardBack'), card=$('card'), picto=$('picto'), name=$('name'),
      sweep=$('sweep'), tiles=$('tiles'), counter=$('counter');
  var EASE='cubic-bezier(.2,.8,.2,1)', BACK='cubic-bezier(.34,1.56,.64,1)';
  var anims = [], paused=false, token=0;

  function A(el, kf, o){
    o = o || {};
    var a = el.animate(kf, {duration: reduce ? 1 : (o.d||600), delay: reduce ? 0 : (o.delay||0), easing:o.e||EASE, fill:'both'});
    anims.push(a);
    if (paused) a.pause();
    return a;
  }
  function wait(ms, tok){
    return new Promise(function(res, rej){
      var el=0, last=performance.now();
      function f(t){
        if (tok!==token) return rej('stop');
        if (!paused) el += t-last;
        last = t;
        if (el>=ms) res(); else requestAnimationFrame(f);
      }
      requestAnimationFrame(f);
    });
  }
  function resetAll(){
    anims.forEach(function(a){ try{a.cancel();}catch(e){} });
    anims = [];
  }
  function setPicto(k){
    while (picto.firstChild) picto.removeChild(picto.firstChild);
    var src = $('sym-'+k);
    Array.prototype.forEach.call(src.children, function(c){
      var n = c.cloneNode(true); n.setAttribute('class','fb'); picto.appendChild(n);
    });
    return Array.prototype.slice.call(picto.children);
  }
  function setCounter(i){ counter.textContent = ('0'+(i+1)).slice(-2)+' / 07'; markChip(i); }

  // Tuiles finales
  var TW=150, GAP=44, X0=(1920-(7*TW+6*GAP))/2, TY=540;
  var tileEls = brands.map(function(b,i){
    var outer=document.createElementNS(NS,'g');
    outer.setAttribute('transform','translate('+(X0+i*(TW+GAP))+','+TY+')');
    var inner=document.createElementNS(NS,'g'); inner.setAttribute('class','fb');
    inner.innerHTML =
      '<rect x="10" y="10" width="150" height="150" rx="30" fill="#8694CA"></rect>'+
      '<rect x="0" y="0" width="150" height="150" rx="30" fill="#3C54A5"></rect>'+
      '<use href="#sym-'+b.k+'" transform="translate(75,75) scale(.34) translate(-1490,-222)"></use>'+
      '<text x="80" y="210" text-anchor="middle" font-family="Open Sans, sans-serif" font-weight="600" font-size="20" letter-spacing="4" fill="#3C54A5">'+b.n+'</text>';
    outer.appendChild(inner); tiles.appendChild(outer);
    return inner;
  });

  function sweepOnce(delay){
    A(sweep,[{opacity:1,transform:'scaleX(0)'},{opacity:1,transform:'scaleX(1)',offset:.55},{opacity:0,transform:'scaleX(1)'}],{d:900,delay:delay});
  }

  function intro(){
    setPicto('tech').forEach(function(c,i){
      A(c,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],{d:450,delay:1500+i*45,e:BACK});
    });
    name.textContent = brands[0].n; setCounter(0);
    A(exF,[{opacity:0,transform:'translateY(-260px)'},{opacity:1,transform:'translateY(0)'}],{d:650,e:BACK});
    A(exB,[{opacity:0,transform:'translate(-40px,20px)'},{opacity:1,transform:'translate(0,0)'}],{d:500,delay:200});
    A(dot,[{opacity:0,transform:'translateY(-560px)'},{opacity:1,transform:'translateY(0)',offset:.55},{transform:'translateY(-70px)',offset:.75},{transform:'translateY(0)'}],{d:950,delay:350,e:'ease-in-out'});
    A(am,[{opacity:0,transform:'translateY(90px)'},{opacity:1,transform:'translateY(0)'}],{d:750,delay:550});
    A(card,[{opacity:0,transform:'scale(.2) rotate(-14deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],{d:750,delay:950,e:BACK});
    A(cardB,[{opacity:0,transform:'translate(-50px,-40px)'},{opacity:1,transform:'translate(0,0)'}],{d:600,delay:1300});
    A(name,[{opacity:0,transform:'translateX(80px)'},{opacity:1,transform:'translateX(0)'}],{d:700,delay:1900});
    sweepOnce(1900);
  }

  function switchTo(i){
    var b = brands[i];
    Array.prototype.forEach.call(picto.children, function(c,j){
      A(c,[{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:0,transform:'translate(70px,-70px) scale(0)'}],{d:380,delay:j*22,e:'ease-in'});
    });
    A(card,[{transform:'scale(1,1)'},{transform:'scale(.93,1.05)',offset:.35},{transform:'scale(1.03,.98)',offset:.7},{transform:'scale(1,1)'}],{d:650,delay:250});
    A(cardB,[{transform:'translate(0,0)'},{transform:'translate(-18px,-12px)',offset:.4},{transform:'translate(0,0)'}],{d:650,delay:250});
    var out = A(name,[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(40px)'}],{d:260,e:'ease-in'});
    return wait(reduce?0:480, token).then(function(){
      setPicto(b.k).forEach(function(c,j){
        A(c,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],{d:460,delay:j*38,e:BACK});
      });
      name.textContent = b.n; setCounter(i);
      A(name,[{opacity:0,transform:'translateX(90px)'},{opacity:1,transform:'translateX(0)'}],{d:600});
      sweepOnce(80);
    });
  }

  function finale(){
    markChip(6);
    A(logo,[{transform:'translate(212px,220px) scale(.85)'},{transform:'translate(547px,110px) scale(.47)'}],{d:1000,e:'cubic-bezier(.65,0,.35,1)'});
    A(tiles,[{opacity:1},{opacity:1}],{d:10});
    tileEls.forEach(function(t,i){
      A(t,[{opacity:0,transform:'translateY(60px) scale(.6)'},{opacity:1,transform:'translateY(0) scale(1)'}],{d:600,delay:700+i*110,e:BACK});
    });
    counter.textContent = 'IAM · 7 marques';
  }
  function outro(){
    A($('stage').querySelector('#logo'),[{opacity:1},{opacity:0}],{d:600});
    A(tiles,[{opacity:1},{opacity:0}],{d:600});
  }

  async function run(start){
    var tok = ++token;
    resetAll();
    try{
      if (start===6){
        name.textContent = brands[0].n; setPicto('tech');
        finale(); await wait(5500,tok); outro(); await wait(700,tok);
        return run(0);
      }
      if (start===0){ intro(); await wait(3600,tok); }
      else { name.textContent = brands[start].n; setPicto(brands[start].k); setCounter(start); await wait(2200,tok); }
      for (var i=Math.max(1,start+1); i<brands.length; i++){
        await switchTo(i); await wait(2600,tok);
      }
      await switchTo(0); await wait(900,tok);
      finale(); await wait(5500,tok);
      outro(); await wait(700,tok);
      run(0);
    }catch(e){ /* séquence interrompue */ }
  }

  // Contrôles
  var chips = $('chips'), chipEls=[];
  brands.concat([{label:'Final'}]).forEach(function(b,i){
    var btn=document.createElement('button'); btn.type='button'; btn.textContent=b.label;
    btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',function(){ setPaused(false); run(i); });
    chips.appendChild(btn); chipEls.push(btn);
  });
  function markChip(i){ chipEls.forEach(function(c,j){ c.setAttribute('aria-pressed', String(i===j)); }); }
  var playBtn=$('play');
  var userPaused=false;
  function setPaused(p){
    paused=p;
    anims.forEach(function(a){ try{ p ? a.pause() : (a.playState==='paused' && a.play()); }catch(e){} });
    playBtn.textContent = p ? 'Lecture' : 'Pause';
  }
  playBtn.addEventListener('click',function(){ userPaused=!paused; setPaused(!paused); });
  $('replay').addEventListener('click',function(){ userPaused=false; setPaused(false); run(0); });

  // Intégré au site : pause quand l'animation n'est pas à l'écran (message de la page), et onglet caché
  window.addEventListener('message',function(e){
    if (e.origin!==location.origin || !e.data || e.data.iamMotion==null) return;
    if (!userPaused) setPaused(!e.data.iamMotion);
  });
  document.addEventListener('visibilitychange',function(){ if (!userPaused) setPaused(document.hidden); });

  // Intégré : la page parente ajuste la hauteur du cadre à son contenu
  if (document.documentElement.classList.contains('embed') && window.parent!==window && window.ResizeObserver){
    new ResizeObserver(function(){ window.parent.postMessage({iamMotionHeight: document.documentElement.scrollHeight}, location.origin); }).observe(document.body);
  }

  run(0);
})();
</script>

</body></html>
