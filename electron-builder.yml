# Identifiant conservé depuis « IAM ERP » : l'installateur met à jour l'ancienne version.
appId: com.iamtechnology.erp
productName: IAM INVOICER
copyright: Copyright © IAM Technology
directories:
  output: dist
  buildResources: resources
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - node_modules/@electric-sql/pglite/**
icon: resources/icon.png

win:
  target: nsis
  artifactName: IAM-INVOICER-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: IAM INVOICER

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: IAM-INVOICER-${version}-${arch}.${ext}
  # Signature « ad hoc » (sans certificat Apple) : indispensable sur les Mac à puce Apple,
  # qui refusent une application non signée (« IAM INVOICER est endommagé »). Au premier
  # lancement, macOS demande une confirmation (Réglages Système → Confidentialité et
  # sécurité → Ouvrir quand même). Avec un certificat Developer ID : remplacer « - » par
  # le nom du certificat, mettre hardenedRuntime à true et ajouter la notarisation.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: IAM INVOICER ${version}
