# Identifiant conservé depuis « IAM ERP » : l'installateur met à jour l'ancienne version.
appId: com.iamtechnology.erp
productName: IAM INVOICER
copyright: Copyright © IAM Technology
directories:
  output: dist
  buildResources: resources
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - node_modules/@electric-sql/pglite/**
icon: resources/icon.png

win:
  target: nsis
  artifactName: IAM-INVOICER-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: IAM INVOICER

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: IAM-INVOICER-${version}-${arch}.${ext}
  # Sans certificat Apple Developer, l'application n'est pas signée : voir README.
  identity: null
dmg:
  title: IAM INVOICER ${version}
